name: Back up the 43 public V2 product images

on:
  push:
    branches: [prep-russian-postgres-cart-20261115]
    paths:
      - '.github/workflows/backup-v2-photos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify all 43 original product photos
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import urllib.request
          from urllib.parse import urlparse
          from hashlib import sha256

          source=pathlib.Path('migration/catalog-snapshot-2026-11-15.json')
          products=json.loads(source.read_text(encoding='utf-8'))
          assert len(products)==43, 'Unexpected catalogue size'
          out=pathlib.Path('photos')
          out.mkdir()
          jobs=[]
          for p in products:
              for n,url in enumerate(p['images']):
                  parsed=urlparse(url)
                  assert parsed.scheme=='https' and parsed.hostname is not None
                  assert parsed.hostname.endswith('.public.blob.vercel-storage.com')
                  jobs.append((p['id'],n,url))
          assert len(jobs)==43, 'Expected 43 photo URLs'

          def fetch(item):
              product_id,idx,url=item
              request=urllib.request.Request(url,headers={'User-Agent':'MatreshkaV2SafeBackup/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  media=response.headers.get('Content-Type','').lower()
                  if not media.startswith('image/'):
                      raise ValueError('Not an image: '+url)
                  data=response.read(16*1024*1024+1)
              if not data or len(data)>16*1024*1024:
                  raise ValueError('Missing or oversized image: '+str(product_id))
              suffix=pathlib.PurePosixPath(urlparse(url).path).suffix.lower()
              if suffix not in {'.png','.jpg','.jpeg','.webp','.gif'}:
                  raise ValueError('Unexpected suffix: '+suffix)
              name=f'product-{product_id}-{idx}{suffix}'
              (out/name).write_bytes(data)
              return {'productId':product_id,'index':idx,'filename':name,
                      'bytes':len(data),'sha256':sha256(data).hexdigest(),'sourceUrl':url}

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              manifest=list(pool.map(fetch,jobs))
          assert len(manifest)==43
          pathlib.Path('photo-manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: backed up',len(manifest),'original images totaling',
                sum(x['bytes'] for x in manifest),'bytes, SHA-256 verified')
          PY
      - name: Save original-image backup as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-v2-product-photos-20261121
          path: |
            photos/
            photo-manifest.json
            migration/catalog-snapshot-2026-11-15.json
          retention-days: 30
          if-no-files-found: error
