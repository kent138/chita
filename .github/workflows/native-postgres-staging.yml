name: Isolated Russian PostgreSQL readiness tests

on:
  push:
    branches: [prep-russian-postgres-cart-20261115]
    paths:
      - 'shop-db.js'
      - 'shop-auth.js'
      - 'public/js/app.js'
      - 'tests/**'
      - '.github/workflows/native-postgres-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: matreshka_ci
          POSTGRES_USER: matreshka_test
          POSTGRES_PASSWORD: throwaway_only_ci_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matreshka_test -d matreshka_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check shop-db.js
          node --check shop-auth.js
          node --check public/js/app.js
      - name: Verify 43-product backup imports into a fresh isolated PostgreSQL
        run: |
          node <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const {Pool}=require('pg');
          (async()=>{
            const credentials='postgresql://matreshka_test:throwaway_only_ci_2026@127.0.0.1:5432/';
            const admin=new Pool({connectionString:credentials+'postgres'});
            await admin.query('CREATE DATABASE matreshka_snapshot_ci');
            await admin.end();
            process.env.DATABASE_URL=credentials+'matreshka_snapshot_ci';
            process.env.SEED_CATALOG_SNAPSHOT='1';
            const {ready,pool}=require('./shop-db');
            try{
              await ready();
              const r=await pool.query(
                'SELECT count(*)::int AS products, sum(jsonb_array_length(images))::int AS photos FROM shop_products');
              assert.equal(r.rows[0].products,43);
              assert.equal(r.rows[0].photos,43);
              console.log('PASS: 43 products and 43 photo URLs bootstrapped from snapshot');
            }finally{await pool.end();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Run all tests against throwaway PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://matreshka_test:throwaway_only_ci_2026@127.0.0.1:5432/matreshka_ci
        run: npm test
